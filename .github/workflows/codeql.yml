#
# CodeQL static analysis (T-002). The repository is private and has no GitHub code-scanning
# upload, so results are kept as a SARIF artifact and scripts/codeql-gate.py fails the build on
# any error- or warning-level finding that is not accepted (docs/SECURITY.md, "Accepted findings").
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - src/apiedge/static
              - console/node_modules
              - tests
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: never
          output: sarif-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results
          retention-days: 30
      - name: Fail on findings
        # A finding is accepted only with BOTH an inline codeql[<rule id>] justification on the
        # flagged line AND a matching row in the "Accepted findings" table of docs/SECURITY.md.
        # The gate also fails on a marker without a row or a row without a marker.
        run: python3 scripts/codeql-gate.py --sarif-dir sarif-results
