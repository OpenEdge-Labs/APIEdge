#
# CodeQL static analysis (T-002). The repository is private and has no GitHub code-scanning
# upload, so results are kept as a SARIF artifact and a gate step fails the build on any
# error- or warning-level finding (see docs/SECURITY.md, "CI security gates").
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - src/apiedge/static
              - console/node_modules
              - tests
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: never
          output: sarif-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results
          retention-days: 30
      - name: Fail on findings
        # A finding is accepted only with an inline `codeql[<rule id>] <reason>` comment on the
        # flagged line (the same syntax GitHub code scanning uses); accepted ones are listed.
        run: |
          python3 - <<'EOF'
          import json, pathlib, sys
          found = 0
          for f in pathlib.Path("sarif-results").glob("*.sarif"):
              for run in json.loads(f.read_text())["runs"]:
                  for r in run.get("results", []):
                      if r.get("level", "warning") not in ("error", "warning"):
                          continue
                      loc = r["locations"][0]["physicalLocation"]
                      uri = loc["artifactLocation"]["uri"]
                      line = loc.get("region", {}).get("startLine", 1)
                      src = pathlib.Path(uri)
                      text = src.read_text().splitlines()[line - 1] if src.is_file() else ""
                      where = f"{uri}:{line} {r['ruleId']}: {r['message']['text']}"
                      if f"codeql[{r['ruleId']}]" in text:
                          print(f"accepted (inline justification): {where}")
                          continue
                      found += 1
                      print(f"::error file={uri},line={line}::{r['ruleId']}: {r['message']['text']}")
                      print(f"FINDING {where}")
          print(f"CodeQL findings (error/warning, not accepted): {found}")
          sys.exit(1 if found else 0)
          EOF
